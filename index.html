<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Focus</title>
<meta name="description" content="Entraînement quotidien de la concentration et de la visualisation.">
<meta name="theme-color" content="#07080b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Focus">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07080b;--card:#0f1219;--card2:#141922;--line:#1d2330;--line2:#2a3242;
  --ink:#eef1f5;--soft:#b8bfcb;--dim:#7e8798;
  --acc:#ffb24a;--acc2:#ff8a3d;--accbg:rgba(255,178,74,.12);
  --ok:#4fd1a5;--cool:#86a8ff;--bad:#ff7a7a;
  --r:20px;--nav:66px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;color:var(--ink);font:15.5px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;
  background:radial-gradient(900px 500px at 50% -180px,#22170b 0%,rgba(7,8,11,0) 65%),var(--bg);overscroll-behavior-y:none}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(var(--nav) + 96px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;margin:0;letter-spacing:.2px}
h1{font-size:36px;line-height:1.05}
h2{font-size:26px;line-height:1.15}
h3{font-size:21px;line-height:1.2}
p{margin:8px 0}
.eyebrow{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:500}
.muted{color:var(--soft)}.dim{color:var(--dim)}.small{font-size:13.5px}.ok{color:var(--ok)}.acc{color:var(--acc)}
.hd{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 0 6px}
.streak{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;background:var(--accbg);border:1px solid rgba(255,178,74,.25);color:var(--acc);font-weight:600}
.streak svg{width:18px;height:18px}
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r);padding:18px;margin:14px 0}
.card.hero{border-color:rgba(255,178,74,.28);background:radial-gradient(420px 220px at 90% -10%,rgba(255,140,50,.16),rgba(0,0,0,0) 70%),linear-gradient(180deg,var(--card2),var(--card))}
.card h3{margin-bottom:4px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;padding:13px 18px;font-weight:600;background:var(--card2);border:1px solid var(--line2);transition:transform .1s}
.btn:active{transform:scale(.98)}
.btn.pri{background:linear-gradient(180deg,#ffc262,#ff9a3c);color:#1b1006;border:0;box-shadow:0 8px 26px rgba(255,150,60,.22)}
.btn.block{width:100%}
.btn.sm{padding:8px 13px;border-radius:11px;font-size:13.5px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:rgba(255,122,122,.35)}
.parts{list-style:none;padding:0;margin:14px 0 16px}
.parts li{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.parts li:last-child{border-bottom:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.tile{text-align:left;background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r);padding:16px;min-height:112px;display:flex;flex-direction:column;justify-content:space-between}
.tile b{font-size:16px;font-weight:600}
.tile span{font-size:12.5px;color:var(--dim);line-height:1.35}
.tile svg{width:24px;height:24px;color:var(--acc)}
.tile.sos{border-color:rgba(255,138,61,.4);background:radial-gradient(200px 120px at 0% 0%,rgba(255,120,50,.18),rgba(0,0,0,0) 70%),linear-gradient(180deg,var(--card2),var(--card))}
.diet{display:flex;align-items:center;gap:14px;margin-top:12px}
.plus{flex:0 0 auto;width:64px;height:64px;border-radius:50%;border:1px solid rgba(255,178,74,.45);background:var(--accbg);color:var(--acc);font-size:28px;font-weight:300;display:grid;place-items:center}
.plus:active{transform:scale(.94)}
.big{font-size:30px;font-weight:300;font-variant-numeric:tabular-nums;line-height:1}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{padding:8px 12px;border-radius:999px;border:1px solid var(--line2);background:var(--card);font-size:13.5px;line-height:1.2}
.chip.on{background:var(--accbg);border-color:rgba(255,178,74,.55);color:var(--acc)}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.lv{background:#0b0e14;border:1px solid var(--line);border-radius:14px;padding:12px}
.lv b{display:block;font-size:22px;font-weight:300}
.lv span{font-size:12px;color:var(--dim)}
.dots{display:flex;gap:4px;margin-top:6px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--line2)}.dots i.on{background:var(--acc)}
.ex{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 0;background:none;border:0;border-bottom:1px solid var(--line)}
.ex:last-child{border-bottom:0}
.ex .ic{flex:0 0 42px;height:42px;border-radius:12px;background:var(--accbg);display:grid;place-items:center;color:var(--acc)}
.ex .ic svg{width:21px;height:21px}
.ex .tx{flex:1;min-width:0}
.ex .tx b{display:block;font-weight:600;font-size:15px}
.ex .tx span{display:block;font-size:13px;color:var(--dim);line-height:1.35}
.ex .du{font-size:12.5px;color:var(--dim);white-space:nowrap}
label.f{display:block;margin:14px 0 6px;font-size:13px;color:var(--soft);font-weight:500}
.in{width:100%;background:#090b10;border:1px solid var(--line2);border-radius:12px;padding:12px 14px;outline:none;line-height:1.45}
textarea.in{min-height:80px;resize:vertical}
.in:focus{border-color:rgba(255,178,74,.55)}
select.in{appearance:none;-webkit-appearance:none}
.goal{display:block;width:100%;text-align:left;background:#0b0e14;border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:10px}
.goal b{font-weight:600}
.goal .meta{font-size:12.5px;color:var(--dim);margin-top:2px}
.goal.done{opacity:.55}
.set{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 0;border-bottom:1px solid var(--line)}
.set:last-child{border-bottom:0}
.set .l b{display:block;font-weight:500}
.set .l span{display:block;font-size:12.5px;color:var(--dim);line-height:1.35}
.sw{position:relative;flex:0 0 50px;height:30px}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw i{position:absolute;inset:0;border-radius:30px;background:#232a37;transition:.2s}
.sw i:after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#cfd5df;transition:.2s}
.sw input:checked+i{background:#e8952f}
.sw input:checked+i:after{transform:translateX(20px);background:#fff}
input[type=range]{width:100%;accent-color:var(--acc)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.kpi{background:#0b0e14;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.kpi b{display:block;font-size:26px;font-weight:300;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi span{font-size:12px;color:var(--dim)}
svg.chart{width:100%;height:auto;display:block;margin-top:10px;overflow:visible}
.hbar{display:grid;grid-template-columns:118px 1fr 26px;align-items:center;gap:8px;font-size:13px;margin:7px 0}
.hbar .t{height:8px;border-radius:8px;background:#1a202b;overflow:hidden}.hbar .t i{display:block;height:100%;background:var(--acc);border-radius:8px}
.jday{padding:14px 0;border-bottom:1px solid var(--line)}
.jday:last-of-type{border-bottom:0}
.jday b{font-weight:600}
.jchips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.jchips span{font-size:12px;padding:4px 9px;border-radius:999px;background:#0b0e14;border:1px solid var(--line);color:var(--soft)}
.jrow{display:grid;grid-template-columns:112px 1fr;gap:10px;font-size:13.5px;margin-top:6px}
.jrow span{color:var(--dim)}
.jrow div{color:var(--ink)}
.jnote{margin-top:10px;padding:10px 12px;border-radius:12px;background:rgba(255,178,74,.07);border:1px solid rgba(255,178,74,.2);font-size:14px;white-space:pre-wrap}
.hist{font-size:13.5px;padding:9px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
.hist:last-child{border-bottom:0}
.note{font-size:13.5px;color:var(--soft);padding:10px 0;border-bottom:1px solid var(--line)}
.note:last-child{border-bottom:0}
.note .dim{font-size:12px}
.heat{display:grid;grid-template-columns:repeat(8,1fr);grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:4px;margin-top:10px}
.heat i{aspect-ratio:1;border-radius:4px;background:#161b25}
ol.steps{padding-left:20px;margin:8px 0}
ol.steps li{margin:6px 0;color:var(--soft);font-size:14px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(8,9,13,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in2{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav)}
nav.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--dim);font-size:10.5px;letter-spacing:.02em}
nav.tabs button.on{color:var(--acc)}
nav.tabs svg{width:22px;height:22px}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(var(--nav) + 14px + env(safe-area-inset-bottom));z-index:21;display:flex;align-items:center;gap:8px;padding:12px 16px;border-radius:999px;border:1px solid rgba(255,150,70,.5);background:rgba(30,18,8,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#ffc27a;font-weight:600;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.fab svg{width:18px;height:18px}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:40;opacity:0;transition:opacity .25s;pointer-events:none}
.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:90vh;overflow:auto;background:#0d1017;border-top:1px solid var(--line2);border-radius:24px 24px 0 0;padding:8px 18px calc(26px + env(safe-area-inset-bottom));transform:translateY(105%);visibility:hidden;transition:transform .3s cubic-bezier(.2,.8,.2,1),visibility 0s .3s}
.sheet.on{transform:none;visibility:visible;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.sheet .grab{width:40px;height:4px;border-radius:4px;background:var(--line2);margin:6px auto 16px}
.sheet-top{position:sticky;top:-8px;z-index:2;display:flex;justify-content:flex-end;margin:0 -6px 4px;padding-top:6px;pointer-events:none}
.sheet-x{pointer-events:auto;width:38px;height:38px;border-radius:50%;background:#1a2030;border:1px solid var(--line2);font-size:15px;display:grid;place-items:center}
.savebar{position:fixed;left:0;right:0;bottom:calc(var(--nav) + env(safe-area-inset-bottom));z-index:19;max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;background:rgba(8,9,13,.96);border-top:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
@media(min-width:600px){.sheet{max-width:560px;margin:0 auto}}
.stepper{display:flex;align-items:center;gap:12px;margin-top:8px}
.stepper button{width:40px;height:40px;border-radius:12px;background:var(--card2);border:1px solid var(--line2);font-size:20px}
.stepper div{flex:1;text-align:center}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translate(-50%,-20px);opacity:0;z-index:80;background:#1b2130;border:1px solid var(--line2);padding:10px 16px;border-radius:12px;font-size:14px;transition:.3s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
/* lecteur */
#player{position:fixed;inset:0;z-index:50;background:#000;display:none;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#player.on{display:block}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block}
.p-top{position:absolute;top:0;left:0;right:0;padding:calc(12px + env(safe-area-inset-top)) 16px 0;display:flex;align-items:center;gap:12px;z-index:5;transition:opacity .6s;pointer-events:none}
.p-top>*{pointer-events:auto}
.p-btn{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);display:grid;place-items:center;color:#fff}
.p-btn svg{width:20px;height:20px}
.p-title{flex:1;text-align:center;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.45)}
.p-count{min-width:44px;text-align:right;color:rgba(255,220,180,.55);font-variant-numeric:tabular-nums;font-size:15px}
.p-cue{position:absolute;left:0;right:0;bottom:calc(158px + env(safe-area-inset-bottom));padding:0 26px;text-align:center;pointer-events:none;z-index:2}
.p-cue div{font-family:"Cormorant Garamond",Georgia,serif;font-size:25px;line-height:1.3;color:rgba(255,238,215,.93);max-width:520px;margin:0 auto;text-shadow:0 2px 18px #000;transition:opacity .9s;opacity:0}
.p-cue div.on{opacity:1}
.p-bot{position:absolute;left:0;right:0;bottom:0;padding:0 20px calc(18px + env(safe-area-inset-bottom));z-index:2;transition:opacity .6s}
.p-scrub{max-width:520px;margin:0 auto;padding:14px 0;cursor:pointer;touch-action:none}
.p-track{position:relative;height:4px;border-radius:4px;background:rgba(255,255,255,.14)}
.p-track i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:4px;background:rgba(255,178,74,.9)}
.p-track b{position:absolute;left:0;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:#ffc27a;box-shadow:0 0 0 5px rgba(255,178,74,.18)}
.p-track span i{position:absolute;top:-3px;width:2px;height:10px;margin-left:-1px;border-radius:1px;background:rgba(255,255,255,.3)}
.p-scrub.drag .p-track b{transform:scale(1.25)}
.p-times{max-width:520px;margin:-4px auto 10px;display:flex;justify-content:space-between;font-size:12px;color:rgba(255,255,255,.5);font-variant-numeric:tabular-nums}
.p-ctl{display:flex;justify-content:center;gap:26px;align-items:center}
.p-ctl .p-btn{width:52px;height:52px}
.p-ctl .p-jump{width:60px;font-size:13px;font-weight:600;color:rgba(255,255,255,.85)}
.p-form .back{align-self:flex-start;margin:0 0 16px}
#player.idle .p-top,#player.idle .p-bot{opacity:.5}
#player.idle.form .p-top{opacity:1}
.p-form{position:absolute;inset:0;z-index:3;background:radial-gradient(600px 400px at 50% 0%,#1d1409 0%,rgba(0,0,0,0) 70%),#05060a;display:none;overflow:auto}
.p-form.on{display:block}
.p-form .pf{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;justify-content:center;padding:calc(70px + env(safe-area-inset-top)) 22px calc(30px + env(safe-area-inset-bottom))}
.p-form h2{font-size:28px;margin-bottom:6px}
.rate{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:18px}
.rate button{height:54px;border-radius:14px;background:var(--card2);border:1px solid var(--line2);font-size:18px}
.opt{display:block;width:100%;text-align:left;padding:15px 16px;margin-top:10px;border-radius:14px;background:var(--card2);border:1px solid var(--line2);font-size:15.5px}
.opt:active{border-color:var(--acc)}
.tip{margin-top:12px;padding:12px 14px;border-radius:12px;background:rgba(255,178,74,.08);border:1px solid rgba(255,178,74,.2);font-size:14px;color:#f3dcc0}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}
.msg{padding:10px 0;border-bottom:1px solid var(--line);font-size:14.5px;color:var(--soft)}
.msg:last-child{border-bottom:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap"><main id="view"></main></div>


<nav class="tabs"><div class="in2">
  <button data-t="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M12 2.8c1.2 3.6 5.2 5.6 5.2 10.4a5.2 5.2 0 0 1-10.4 0c0-2.2 1.1-3.8 2.3-4.9.2 1.7 1 2.8 2.1 3.2-.4-3.2-.4-5.9.8-8.7z"/></svg>Aujourd'hui</button>
  <button data-t="lib"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg>Exercices</button>
  <button data-t="vision"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M2.5 12s3.5-6.5 9.5-6.5 9.5 6.5 9.5 6.5-3.5 6.5-9.5 6.5S2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></svg>Vision</button>
  <button data-t="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 20V12M10 20V6M16 20v-9M22 20H2"/></svg>Progrès</button>
  <button data-t="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/></svg>Réglages</button>
</div></nav>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<div id="player">
  <canvas id="stage"></canvas>
  <div class="p-top">
    <button class="p-btn" id="pClose" aria-label="Arrêter"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="p-title" id="pTitle"></div>
    <div class="p-count" id="pCount"></div>
  </div>
  <div class="p-cue"><div id="pCue"></div></div>
  <div class="p-bot">
    <div class="p-scrub" id="pScrub"><div class="p-track" id="pTrack"><span id="pTicks"></span><i id="pBar"></i><b id="pThumb"></b></div></div>
    <div class="p-times"><span id="pTime">0:00</span><span id="pTotal">0:00</span></div>
    <div class="p-ctl">
      <button class="p-btn p-jump" id="pBack15" aria-label="Reculer de 15 secondes">−15 s</button>
      <button class="p-btn" id="pPause" aria-label="Pause"></button>
      <button class="p-btn p-jump" id="pFwd15" aria-label="Avancer de 15 secondes">+15 s</button>
    </div>
  </div>
  <div class="p-form" id="pForm"></div>
</div>

<script>
(() => {
'use strict';

/* ---------- outils ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const params = new URLSearchParams(location.search);
const SPEED = Math.max(1, +params.get('speed') || 1);
const KEY = 'focus-mental-v1';
const pad = n => String(n).padStart(2, '0');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  const ring = d => { tone(base, 0.16, 5, d); tone(base * 2.76, 0.05, 3, d); tone(base * 5.4, 0.022, 1.8, d); tone(base * 1.5, 0.035, 3.5, d); };

// Boucles de bruit sans coupure : la fin de la boucle se fond dans son début (fondu à puissance constante).
const LOOPS = {};

  for (let ch = 0; ch < 2; ch++) {
    const n = new Float32Array(N + X);

      for (let i = 0; i < N + X; i++) {
        const w = Math.random() * 2 - 1;
        b0 = 0.99886 * b0 + w * 0.0555179; b1 = 0.99332 * b1 + w * 0.0750759; b2 = 0.969 * b2 + w * 0.153852;
        b3 = 0.8665 * b3 + w * 0.3104856; b4 = 0.55 * b4 + w * 0.5329522; b5 = -0.7616 * b5 - w * 0.016898;

    }
    const d = buf.getChannelData(ch);
    for (let i = 0; i < N; i++) d[i] = n[i];

let AMB = null;
const AMB_MODE = () => S.settings.amb || 'vb';

  if (!hz || AMB_MODE() === 'none') { ambStop(); return; }
  if (!AMB) {
    AMB = ambGraph(c, master, hz);
    AMB.out.gain.setTargetAtTime(1, c.currentTime, 1.5);
  } else if (AMB.hz !== hz) {
    for (const x of AMB.osc) x.o.frequency.setTargetAtTime(x.car + (x.side ? hz / 2 : -hz / 2), c.currentTime, 4);

}
function ambGraph(c, dest, hz) {

    const out = c.createGain(); out.gain.value = 0; out.connect(duck);
    const src = c.createBufferSource(); src.buffer = loopBuf(c, 'pink'); src.loop = true;
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 420; lp.Q.value = 0.4;
    const wg = c.createGain(); wg.gain.value = WAVE_G();

    const l1 = c.createOscillator(); l1.frequency.value = 0.07; const d1 = c.createGain(); d1.gain.value = 150; l1.connect(d1).connect(lp.frequency); l1.start();

function dailySession(n) {
  const st = stageOf(n), parts = [];
  const add = (name, steps) => parts.push({ n: name, steps });
  if (S.affirmation.trim()) add('Affirmation', affSteps());
  switch (st.n) {
    case 1: add('Cohérence cardiaque', breath('coherence', 3)); add('Le point', pointSteps()); add('Corps endormi', endormiSteps({ short: true })); break;
    case 2: add('Soupir physiologique', breath('soupir', 1.5)); add('La flamme', flameSteps()); add('Image mentale', imageSteps()); break;
    case 3: add('La boîte', boiteSteps()); add('Résonance', breath('resonance', 2)); add('Le point', pointSteps()); add('Image mentale', imageSteps()); break;
    case 4: add('Cohérence cardiaque', breath('coherence', 2)); add('La flamme', flameSteps()); add('Objectif atteint', objectifSteps(pickGoal(n))); break;
    case 5: add('Corps endormi', endormiSteps({ keep: true })); add('Le corps', corpsSteps({ after: true })); add('Le point', pointSteps()); break;
    case 6: add('Soupir physiologique', breath('soupir', 1)); add('La flamme', flameSteps());
      if (n % 2) add('Futur soi', futurSteps()); else add('Journée idéale', journeeSteps());
      add('Objectif atteint', objectifSteps(pickGoal(n), { short: true })); break;
    default: {
      const r = n % 3;
      if (r === 0) { add('Cohérence cardiaque', breath('coherence', 2)); add('Le point', pointSteps()); add('Objectif atteint', objectifSteps(pickGoal(n))); }
      else if (r === 1) { add('Soupir physiologique', breath('soupir', 1)); add('La flamme', flameSteps()); add('Le corps', corpsSteps()); }
      else { add('La boîte', boiteSteps()); add('Image mentale', imageSteps()); add('Journée idéale', journeeSteps()); }
    }
  }
  add('Intention du jour', intentionSteps());
  parts[0].steps.unshift({ vis: 'orb', title: `Jour ${n}`, cues: [{ t: `Jour ${n}. ${st.name}.`, s: `${st.name}.`, p: 1 }], tail: 0.5, bell: false });
  return {
    title: 'Séance du jour', type: 'daily', day: n, parts, steps: parts.flatMap(p => p.steps),
    onDone: () => {
      const out = [];
      if (S.program.last !== dkey()) { S.program.last = dkey(); S.program.day = n + 1; out.push(`Jour ${n} terminé. Demain, jour ${n + 1}.`); }
      return out;
    }
  };
}
function todaysDay() { return S.program.last === dkey() ? S.program.day - 1 : S.program.day; }

function sched(step) {
  const cues = []; let cur = step.lead ?? 1;
  for (const c of step.cues || []) {
    if (c.at != null) cur = c.at;
    cues.push({ at: cur, t: c.t, s: c.s, say: c.say !== false });
    cur += est(c.s || c.t) + (c.p ?? 3);
  }
  return { cues, dur: step.dur ?? (cur + (step.tail ?? 4)) };
}
const estimate = steps => steps.reduce((a, s) => a + (s.type ? 15 : sched(s).dur), 0);

function practiceDays() { const set = new Set(); for (const e of S.history) if (e.secs >= 60) set.add(e.date); return set; }

  return n;

function streakDays() { const set = practiceDays(); return runBack(k => set.has(k)); }
function dietStreak() { return runBack(k => S.days[k] && S.days[k].held === 'Tenue'); }

  const keys = Object.keys(S.days).sort(); let best = 0, cur = 0, prev = null;
  for (const k of keys) {
    if (S.days[k].held === 'Tenue') { cur = prev && dkey(addDays(new Date(prev + 'T12:00'), 1)) === k ? cur + 1 : 1; best = Math.max(best, cur); prev = k; }
    else { cur = 0; prev = null; }

function minsOn(k) { return S.history.filter(e => e.date === k).reduce((a, e) => a + e.secs, 0) / 60; }

  return `<svg class="chart" viewBox="0 0 ${W} ${H}">
    <line x1="${PX}" y1="${PY}" x2="${W}" y2="${PY}" stroke="#1d2330"/><line x1="${PX}" y1="${H - PY}" x2="${W}" y2="${H - PY}" stroke="#1d2330"/>
    <text x="0" y="${PY + 4}" fill="#7e8798" font-size="10">${lab(mx)}</text><text x="0" y="${H - PY + 3}" fill="#7e8798" font-size="10">${lab(mn)}</text>
    <path d="${d}" fill="none" stroke="${o.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map(p => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.6" fill="${o.color}"/>`).join('')}
  </svg>`;
}
function barChart(vals, o = {}) {
  const W = 320, H = o.h || 90, n = vals.length, gap = 2, bw = (W - gap * (n - 1)) / n, mx = Math.max(...vals, 1);
  return `<svg class="chart" viewBox="0 0 ${W} ${H + (o.labels ? 12 : 0)}">${vals.map((v, i) => {
    const bh = v > 0 ? Math.max(2, v / mx * (H - 4)) : 1;
    return `<rect x="${(i * (bw + gap)).toFixed(1)}" y="${(H - bh).toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="2" fill="${v > 0 ? '#ffb24a' : '#1a202b'}"/>` +
      (o.labels && i % 3 === 0 ? `<text x="${(i * (bw + gap) + bw / 2).toFixed(1)}" y="${H + 11}" fill="#7e8798" font-size="9" text-anchor="middle">${i + 6}</text>` : '');
  }).join('')}</svg>`;
}
function getPath(p) { return p.split('.').reduce((o, k) => (o ? o[k] : ''), S) || ''; }
function setPath(p, v) { const ks = p.split('.'); let o = S; for (let i = 0; i < ks.length - 1; i++) o = o[ks[i]]; o[ks[ks.length - 1]] = v; }

/* fiches */
const SH = { opts: {} };
function exSheet(id) {
  const e = EX[id];
  SH.id = id; SH.opts = { min: e.def, goal: (S.goals.find(g => !g.done) || {}).id || null, task: '', sound: 'vagues' };
  if (id === 'sprint') SH.opts.min = 25;
  renderExSheet();
}
function renderExSheet() {
  const id = SH.id, e = EX[id], o = SH.opts;
  let opts = '';
  if (e.opt === 'min') opts = `<label class="f">Durée</label><div class="chips">${e.mins.map(m => `<button class="chip ${o.min === m ? 'on' : ''}" data-act="opt" data-k="min" data-v="${m}">${m} min</button>`).join('')}</div>`;
  if (e.opt === 'level') {
    const k = e.lk, L = S.levels[k];
    opts = `<label class="f">Palier</label><div class="stepper"><button data-act="lvl" data-k="${k}" data-d="-1">−</button><div><b>Palier ${L}</b><div class="small dim">${esc(levelLabel(k, L))}</div>${dotsHtml(S.wins[k]).replace('class="dots"', 'class="dots" style="justify-content:center"')}</div><button data-act="lvl" data-k="${k}" data-d="1">+</button></div>
      <p class="small dim">Le palier monte tout seul après trois séances réussies. Tu peux aussi le régler à la main.</p>`;
  }
  if (e.opt === 'goal') {
    const gs = S.goals.filter(g => !g.done);
    opts = gs.length ? `<label class="f">Objectif</label><div class="chips">${gs.map(g => `<button class="chip ${o.goal === g.id ? 'on' : ''}" data-act="opt" data-k="goal" data-v="${g.id}">${esc(g.title)}</button>`).join('')}</div>`
      : '<p class="small tip">Tu n\'as pas encore d\'objectif dans l\'onglet Vision. La séance fonctionne quand même, avec des questions ouvertes.</p>';
  }
  if (e.opt === 'sprint') {
    opts = `<label class="f">Durée</label><div class="chips">${[10, 25, 45, 60].map(m => `<button class="chip ${o.min === m ? 'on' : ''}" data-act="opt" data-k="min" data-v="${m}">${m} min</button>`).join('')}</div>
      <label class="f">La tâche</label><input class="in" id="sprintTask" placeholder="Ex. : rédiger la note de synthèse" value="${esc(o.task)}">
      <label class="f">Fond sonore</label><div class="chips">${['vagues', 'bruit brun', 'aucun'].map(s => `<button class="chip ${o.sound === s ? 'on' : ''}" data-act="opt" data-k="sound" data-v="${s}">${cap(s)}</button>`).join('')}</div>`;
  }
  openSheet(`<div class="row" style="gap:12px"><div class="ic" style="flex:0 0 44px;height:44px;border-radius:12px;background:var(--accbg);display:grid;place-items:center;color:var(--acc)">${IC[e.ic].replace('<svg', '<svg width="22" height="22"')}</div><h2>${esc(e.n)}</h2></div>
    <p class="muted" style="margin-top:12px">${esc(e.info)}</p>${opts}
    <button class="btn pri block" style="margin-top:20px" data-act="ex-start">Commencer${e.opt === 'sprint' ? '' : ' · ' + minLabel(estimate(e.build(o)))}</button>`);
}
function goalSheet(id) {
  const g = S.goals.find(x => x.id === id) || { id: '', title: '', domain: '', date: '', scene: '', feeling: '', why: '', obstacle: '', plan: '', done: false };
  const DOM = ['Travail', 'Argent', 'Santé et corps', 'Relations', 'Personnel', 'Autre'];
  const f = (k, label, ph, rows = 3) => `<label class="f">${label}</label><textarea class="in" rows="${rows}" id="g_${k}" placeholder="${esc(ph)}">${esc(g[k])}</textarea>`;
  openSheet(`<h2>${g.id ? 'Objectif' : 'Nouvel objectif'}</h2>
    <label class="f">L'objectif</label><input class="in" id="g_title" value="${esc(g.title)}" placeholder="Ex. : ouvrir mon cabinet avec 20 clients">
    <div class="row" style="gap:10px;align-items:flex-start">
      <div style="flex:1"><label class="f">Domaine</label><select class="in" id="g_domain"><option value=""></option>${DOM.map(d => `<option ${g.domain === d ? 'selected' : ''}>${d}</option>`).join('')}</select></div>
      <div style="flex:1"><label class="f">Échéance</label><input class="in" type="date" id="g_date" value="${esc(g.date)}"></div>
    </div>
    ${f('scene', 'La scène qui prouve que c\'est fait', 'Ex. : je referme l\'ordinateur un vendredi à 17 h, le planning du mois est plein, je descends sur la terrasse')}
    ${f('feeling', 'Ce que je ressens à ce moment-là', 'Ex. : de la fierté calme, les épaules légères, l\'envie de rire', 2)}
    ${f('why', 'Pourquoi c\'est important pour moi', 'Ex. : décider seul de mes journées', 2)}
    ${f('obstacle', 'L\'obstacle en moi le plus probable', 'Ex. : je repousse les appels à passer', 2)}
    ${f('plan', 'Mon plan : si… alors…', 'Ex. : si je repousse un appel, alors je le passe dans les 5 minutes, avant toute autre chose', 2)}
    <div class="set" style="border:0;padding-bottom:0"><div class="l"><b>Atteint</b></div><label class="sw"><input type="checkbox" id="g_done" ${g.done ? 'checked' : ''}><i></i></label></div>
    <div class="row" style="margin-top:18px"><button class="btn ghost" style="flex:1" data-act="close-sheet">Annuler</button><button class="btn pri" style="flex:2" data-act="goal-save" data-id="${g.id}">Enregistrer</button></div>
    ${g.id ? `<button class="btn block ghost danger" style="margin-top:8px" data-act="goal-del" data-id="${g.id}">Supprimer</button>` : ''}`);
}

/* ---------- actions ---------- */
document.addEventListener('click', e => {
  const tabBtn = e.target.closest('nav.tabs button');
  if (tabBtn) { go(tabBtn.dataset.t); return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act;
  switch (a) {
    case 'daily': { const n = todaysDay(); startSession(dailySession(n)); break; }
    case 'sos': startSession({ title: 'Je décroche', type: 'sos', steps: sosSteps() }); break;
    case 'energie': startSession({ title: "Canaliser l'énergie", type: 'energie', steps: energieSteps() }); break;
    case 'ex': {
      if (el.dataset.id === 'sos') { startSession({ title: 'Je décroche', type: 'sos', steps: sosSteps() }); break; }
      if (el.dataset.id === 'energie') { startSession({ title: "Canaliser l'énergie", type: 'energie', steps: energieSteps() }); break; }
      if (el.dataset.id === 'revue') { startSession({ title: 'Revue du soir', type: 'review', steps: reviewSteps() }); break; }
      exSheet(el.dataset.id); break;
    }
    case 'opt': { const k = el.dataset.k; let v = el.dataset.v; if (k === 'min') v = +v; if (k === 'sprint' || SH.id === 'sprint') { const t = $('#sprintTask'); if (t) SH.opts.task = t.value; } SH.opts[k] = v; renderExSheet(); break; }
    case 'lvl': { const k = el.dataset.k; const L = Math.min(MAXL[k], Math.max(1, S.levels[k] + +el.dataset.d)); if (L !== S.levels[k]) { S.levels[k] = L; S.wins[k] = 0; save(); } renderExSheet(); break; }
    case 'ex-start': {
      const e2 = EX[SH.id];
      if (SH.id === 'sprint') SH.opts.task = ($('#sprintTask') || {}).value || '';
      startSession({ title: e2.n, type: e2.type || 'exo', steps: e2.build(SH.opts) });
      break;
    }
    case 'goto': S.seen.welcome = true; save(); go(el.dataset.t); break;
    case 'welcome-ok': S.seen.welcome = true; save(); render(); break;
    case 'caught': D().caught++; save(); render(); if (navigator.vibrate) navigator.vibrate(10); break;
    case 'watch': D().watch = el.dataset.v; save(); render(); break;
    case 'watch-reset': D().watch = ''; save(); render(); break;
    case 'diet-info': openSheet(`<h2>La diète mentale</h2>
      <p class="muted">Emmet Fox a proposé en 1935 un défi de sept jours : ne pas s'attarder sur une pensée négative. La pensée vient, c'est normal. Ce qui compte, c'est de ne pas la nourrir.</p>
      <p class="muted">Quand tu en remarques une, tu la remplaces par son contraire ou par ton objectif, et tu touches « +1 ». Le compteur ne mesure pas tes échecs, il mesure ta vigilance : au début il monte, puis il baisse quand les pensées reviennent moins.</p>
      <p class="muted">Le soir, tu indiques si la journée est tenue. Si tu t'es laissé aller à ruminer longtemps, elle est lâchée et le défi repart de zéro. Fox était strict là-dessus, c'est ce qui fait la force de l'exercice.</p>
      <button class="btn block" style="margin-top:12px" data-act="close-sheet">Compris</button>`); break;
    case 'close-sheet': closeSheet(); break;
    case 'journal-more': JLIM += 14; render(); break;
    case 'note-edit': {
      const k = el.dataset.d;
      openSheet(`<h2>${esc(dateDay(k))}</h2><label class="f">Mon commentaire sur cette journée</label>
        <textarea class="in" id="noteIn" rows="6" placeholder="Ce qui s'est passé, ce que tu as ressenti, ce que tu retiens">${esc((S.days[k] || {}).note || '')}</textarea>
        <div class="row" style="margin-top:16px"><button class="btn ghost" style="flex:1" data-act="close-sheet">Annuler</button><button class="btn pri" style="flex:2" data-act="note-save" data-d="${k}">Enregistrer</button></div>`);
      setTimeout(() => { const t = $('#noteIn'); if (t) t.focus(); }, 350);
      break;
    }
    case 'note-save': {
      const k = el.dataset.d, v = ($('#noteIn') || {}).value || '';
      D(k).note = v.trim(); save(); closeSheet();
      const y = window.scrollY; render(); window.scrollTo(0, y); toast('Commentaire enregistré'); break;
    }
    case 'vision-save': { if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); clearTimeout(saveT); S.savedAt = hhmm(); save(); const el = $('#saveState'); if (el) el.textContent = 'Enregistrée à ' + S.savedAt; toast('Vision enregistrée'); break; }
    case 'key-paste': {
      (navigator.clipboard && navigator.clipboard.readText ? navigator.clipboard.readText() : Promise.reject())
        .then(t => {
          const k = (t || '').trim().match(/sk_[A-Za-z0-9]+/);
          if (!k) { toast("Pas de clé ElevenLabs dans le presse-papiers (elle commence par sk_)"); return; }
          S.settings.elKey = k[0]; save(); render(); toast('Clé enregistrée sur ce téléphone');
        })
        .catch(() => toast('Colle la clé à la main dans le champ, le téléphone refuse la lecture du presse-papiers'));
      break;
    }
    case 'perso-prep': {
      ac();
      const st = $('#persoState');
      voxReady.then(async () => {
        if (!canGenerate()) { if (st) st.textContent = "La voix du guide n'est pas encore installée."; return; }
        const steps = [];
        for (let n = 1; n <= 46; n++) steps.push(...dailySession(n).steps);
        for (const id in EX) { try { steps.push(...EX[id].build({ min: 2, goal: (S.goals[0] || {}).id })); } catch (e) {} }
        for (const g of S.goals) steps.push(...objectifSteps(g), ...objectifSteps(g, { short: true }));
        steps.push(...energieSteps(), ...reviewSteps());
        const list = spokenOf(steps).filter(t => !(VOX.idx.clips && VOX.idx.clips[vhash(t)] != null));
        if (!list.length) { if (st) st.textContent = 'Rien à préparer : remplis d\'abord Vision.'; return; }
        try { await genPersonal('Ton objectif.'); } catch (e) {
          if (st) st.textContent = /401|403/.test(String(e)) ? 'Clé refusée par ElevenLabs. Vérifie-la ou crée-en une nouvelle.' : 'ElevenLabs ne répond pas. Réessaie avec une connexion.';
          return;
        }
        let done = 0, ok = 0;
        const q = list.slice();
        const w = async () => { while (q.length) { const b = await loadClip(q.shift()); done++; if (b) ok++; if (st) st.textContent = `Préparation : ${done} / ${list.length}`; } };
        await Promise.all(Array.from({ length: 3 }, w));
        if (st) st.textContent = `${ok} phrase${ok > 1 ? 's' : ''} personnelle${ok > 1 ? 's' : ''} lue${ok > 1 ? 's' : ''} par Damien, gardée${ok > 1 ? 's' : ''} sur ce téléphone.${ok < list.length ? ` ${list.length - ok} en échec, elles seront retentées en séance.` : ''}`;
      });
      break;
    }
    case 'vox-offline': {
      ac(); toast('Téléchargement des voix…');
      voxReady.then(async () => {
        if (!VOX.idx) { toast("Pas de voix enregistrée à télécharger"); return; }
        const hs = Object.keys(VOX.idx.clips); let n = 0;
        const q = hs.slice(); const w = async () => { while (q.length) { const h = q.shift(); try { await fetch(`audio/${h}.mp3`); } catch (e) {} n++; } };
        await Promise.all(Array.from({ length: 6 }, w));
        toast(`${n} enregistrements disponibles hors connexion`);
      });
      break;
    }
    case 'goal-new': goalSheet(null); break;
    case 'goal-edit': goalSheet(el.dataset.id); break;
    case 'goal-save': {
      const v = k => ($('#g_' + k) || {}).value || '';
      const title = v('title').trim(); if (!title) { $('#g_title').focus(); toast("Donne un nom à l'objectif"); return; }
      let g = S.goals.find(x => x.id === el.dataset.id);
      if (!g) { g = { id: uid(), visits: 0, created: dkey() }; S.goals.push(g); }
      Object.assign(g, { title, domain: v('domain'), date: v('date'), scene: v('scene').trim(), feeling: v('feeling').trim(), why: v('why').trim(), obstacle: v('obstacle').trim(), plan: v('plan').trim(), done: $('#g_done').checked });
      save(); closeSheet(); render(); toast('Objectif enregistré'); break;
    }
    case 'goal-del': if (confirm('Supprimer cet objectif ?')) { S.goals = S.goals.filter(x => x.id !== el.dataset.id); save(); closeSheet(); render(); } break;
    case 'test-voice': {
      ac(); audioSession(); stopVox();
      const t = "Ferme les yeux. Trois respirations lentes, l'expiration plus longue que l'inspiration.";
      voxReady.then(() => loadClip(t)).then(b => { if (b) { const v = S.settings.voice; S.settings.voice = true; sayVox(t); S.settings.voice = v; } else speak(t, true); });
      break;
    }
    case 'test-sound': {
      ac(); audioSession();
      if (AMB_MODE() === 'none') { toast('Fond sonore réglé sur « Aucun »'); break; }
      setBin(7); clearTimeout(window.__ambT); window.__ambT = setTimeout(() => { if (!P.on) ambStop(); }, 10000);
      toast('Dix secondes de fond sonore, règle le volume pendant ce temps'); break;
    }
    case 'amb': { S.settings.amb = el.dataset.v; save(); binLevel(); if (S.settings.amb === 'none') ambStop(); render(); break; }
    case 'day': { const n = Math.max(1, todaysDay() + +el.dataset.d); S.program.day = n; S.program.last = null; save(); render(); break; }
    case 'export': {
      const copy = JSON.parse(JSON.stringify(S)); delete copy.settings.elKey;
      const blob = new Blob([JSON.stringify(copy, null, 1)], { type: 'application/json' });
      const url = URL.createObjectURL(blob), lk = document.createElement('a');
      lk.href = url; lk.download = `focus-sauvegarde-${dkey()}.json`; document.body.appendChild(lk); lk.click(); lk.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000); break;
    }
    case 'import': $('#importFile').click(); break;
    case 'reset': if (confirm('Effacer toutes tes données ? Exporte-les avant si tu veux les garder.') && confirm('Vraiment tout effacer ?')) { S = DEF(); save(); render(); toast('Données effacées'); } break;
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.path) { setPath(t.dataset.path, t.value); saveSoon(); return; }
  if (t.dataset.set === 'rate') { S.settings.rate = +t.value; $('#rateV').textContent = rateLabel(+t.value); saveSoon(); }
  if (t.dataset.set === 'binVol') { S.settings.binVol = +t.value; binLevel(); saveSoon(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'importFile' && t.files[0]) {
    const r = new FileReader();
    r.onload = () => {
      try { const o = JSON.parse(r.result); if (!o || o.v !== 1 || !o.settings) throw 0; const key = S.settings.elKey; S = merge(DEF(), o); if (!S.settings.elKey) S.settings.elKey = key; save(); pickVoice(); render(); toast('Données importées'); }
      catch (err) { toast("Ce fichier n'est pas une sauvegarde Focus"); }
    };
    r.readAsText(t.files[0]); t.value = ''; return;
  }
  const k = t.dataset.set; if (!k) return;
  if (t.type === 'checkbox') S.settings[k] = t.checked;
  else if (k === 'voiceURI') { S.settings.voiceURI = t.value; pickVoice(); }
  else if (k === 'elKey') { const m = t.value.match(/sk_[A-Za-z0-9]+/); S.settings.elKey = m ? m[0] : t.value.trim(); save(); render(); toast(S.settings.elKey ? 'Clé enregistrée sur ce téléphone' : 'Clé retirée'); }
  save();
});

/* ---------- textes fixes à enregistrer ---------- */
window.__focusTexts = () => {
  const keep = S, all = [];
  const pass = mark => {
    S = DEF();
    if (mark) {
      S.affirmation = mark;
      S.goals = [{ id: 'g', title: mark, scene: mark, feeling: mark, why: mark, obstacle: mark, plan: mark }];
      S.body = { vision: mark, zone: mark, actions: mark };
      S.life = { lieu: mark, travail: mark, gens: mark, energie: mark, argent: mark, detail: mark };
    }
    for (let n = 1; n <= 46; n++) all.push(...dailySession(n).steps);
    for (let L = 1; L <= 6; L++) { S.levels.image = L; all.push(...imageSteps()); }
    for (const rc of [false, true]) { S.settings.realCandle = rc; for (let L = 1; L <= 8; L++) { S.levels.flame = L; all.push(...flameSteps()); } }
    S.settings.realCandle = false; S.levels.flame = 1; S.levels.image = 1;
    for (const id in EX) { try { all.push(...EX[id].build({ min: EX[id].def || 2, goal: 'g', task: '', sound: 'aucun' })); } catch (e) {} }
    for (const m of [10, 25, 45, 60]) all.push(...sprintSteps(m));
    all.push(...energieSteps(), ...sosSteps(), ...reviewSteps(), ...endormiSteps({ short: true }), ...endormiSteps({ keep: true }), ...corpsSteps({ after: true }), ...objectifSteps(S.goals[0] || null, { short: true }));
  };
  pass(''); pass('§');
  S = keep;
  const extra = ['Inspire', 'Expire', 'Retiens', 'À vide', 'Encore un peu', 'Expire longuement', 'Inspire, contracte', 'Retiens, ça monte', 'Expire, relâche'];
  return [...new Set([...spokenOf(all), ...extra].map(vnorm))].filter(t => t && !t.includes('§'));
};
window.__focusHash = vhash;

/* ---------- démarrage ---------- */
render();
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});
if (params.get('go')) go(params.get('go'));
})();
</script>
</body>
</html>
